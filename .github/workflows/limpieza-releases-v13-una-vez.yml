name: CONTACTO 2010 V1.3 - Consolidar arte historico y limpiar Releases
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/limpieza-releases-v13-una-vez.yml'
permissions:
  contents: write
jobs:
  conservar-y-limpiar:
    if: github.repository == 'OnRail76/Contacto-2010' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que V1.3 funciona y el historial esta corregido
        run: |
          set -euo pipefail
          test -s HISTORIAL_VERSIONES.md
          grep -F 'Versión oficial vigente: **V1.3**' HISTORIAL_VERSIONES.md
          gh release view v1.3 --json tagName --jq .tagName | grep -Fx v1.3
          gh release view v1.2.1 --json tagName --jq .tagName | grep -Fx v1.2.1
          gh release view v1.3 --json assets --jq '.assets[].name' >/tmp/assets-v13.txt
          for file in Contacto_2010_V1.3-x86_64.AppImage CONTACTO_2010_V1.3_WINDOWS_x64.zip CONTACTO_2010_V1.3_ATLAS_MEMORIA_MANUAL_GRIT_NOVA.pdf CONTACTO_2010_CARATULA_OFICIAL_4K.png SHA256_CONTACTO_2010_V1.3.txt; do
            grep -Fx "$file" /tmp/assets-v13.txt
          done
      - name: Conservar originales historicos que solo estaban en V1.2.1
        run: |
          set -euo pipefail
          mkdir -p /tmp/arte-historico
          gh release download v1.2.1 --pattern 'CONTACTO_2010_ESCENA_FINAL_OFICIAL_4K.png' --pattern 'AURA_01_SHEET_RGBA_12F.png' --dir /tmp/arte-historico
          test -s /tmp/arte-historico/CONTACTO_2010_ESCENA_FINAL_OFICIAL_4K.png
          test -s /tmp/arte-historico/AURA_01_SHEET_RGBA_12F.png
          gh release upload v1.3 /tmp/arte-historico/CONTACTO_2010_ESCENA_FINAL_OFICIAL_4K.png /tmp/arte-historico/AURA_01_SHEET_RGBA_12F.png
          gh release view v1.3 --json assets --jq '.assets[].name' >/tmp/arte-v13.txt
          grep -Fx 'CONTACTO_2010_ESCENA_FINAL_OFICIAL_4K.png' /tmp/arte-v13.txt
          grep -Fx 'AURA_01_SHEET_RGBA_12F.png' /tmp/arte-v13.txt
      - name: Actualizar sumas del arte adicional en la Release
        run: |
          set -euo pipefail
          cd /tmp/arte-historico
          sha256sum CONTACTO_2010_ESCENA_FINAL_OFICIAL_4K.png AURA_01_SHEET_RGBA_12F.png > SHA256_ARTE_HISTORICO_V1.3.txt
          gh release upload v1.3 SHA256_ARTE_HISTORICO_V1.3.txt
      - name: Retirar V1.2.1 sin borrar tags ni commits
        run: |
          set -euo pipefail
          gh release delete v1.2.1 --yes
          actual="$(gh release list --limit 40 --json tagName --jq '.[].tagName')"
          test "$actual" = "v1.3"
          gh release view v1.3 --json assets --jq '.assets[].name' >/tmp/assets-final.txt
          for f in Contacto_2010_V1.3-x86_64.AppImage CONTACTO_2010_V1.3_WINDOWS_x64.zip CONTACTO_2010_V1.3_ATLAS_MEMORIA_MANUAL_GRIT_NOVA.pdf CONTACTO_2010_CARATULA_OFICIAL_4K.png CONTACTO_2010_ESCENA_FINAL_OFICIAL_4K.png AURA_01_SHEET_RGBA_12F.png; do
            grep -Fx "$f" /tmp/assets-final.txt
          done
          echo 'VERIFICADO: una sola Release, V1.3. Arte histórico a salvo.'
