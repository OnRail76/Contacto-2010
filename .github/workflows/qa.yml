name: Pruebas C++17 SDL2
on:
  push:
    branches: [main]
    paths:
      - 'fuentes/**'
      - 'motor/**'
      - 'assets/**'
      - 'banda_sonora_original/**'
      - 'packaging/**'
      - 'COMPILAR_LINUX.sh'
      - 'lib/**'
      - '.github/workflows/qa.yml'
  pull_request:
    paths:
      - 'fuentes/**'
      - 'motor/**'
      - 'assets/**'
      - 'banda_sonora_original/**'
      - 'packaging/**'
      - 'COMPILAR_LINUX.sh'
      - 'lib/**'
      - '.github/workflows/qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-qa:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias Linux
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libsdl2-dev libpng-dev libvorbis-dev
      - name: Compilar juego y GRIT NOVA ENGINE
        run: bash COMPILAR_LINUX.sh
      - name: Pruebas de regresión sin monitor ni audio físico
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          for test in             --self-test --self-test-fase2 --self-test-fase3 --self-test-fase4 --self-test-fase5             --test-combate-fase2 --test-combate-fase3 --test-combate-fase4 --test-combate-fase5             --self-test-controles --self-test-sierras --self-test-estalactitas             --self-test-halcones --self-test-rayos --self-test-final --self-test-bso             --self-test-firebird --self-test-avisos-escudo --self-test-estereo-crt --self-test-menu --self-test-jingles --self-test-jingles-nuevos --self-test-audio --self-test-disparos --self-test-aura --self-test-piloto-visor; do
            echo "===== $test ====="
            ./CONTACTO_2010_LINUX "$test"
          done
          bash motor/PROBAR_MOTOR.sh
