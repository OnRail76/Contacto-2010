name: CONTACTO 2010 V1.3 - Refrescar ejecutables con logo restaurado
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refrescar-ejecutables-v13-una-vez.yml'
permissions:
  contents: write
concurrency:
  group: contacto-2010-release-v13
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Instalar librerias nativas
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libsdl2-dev libpng-dev libvorbis-dev python3 curl
      - name: Compilar y comprobar el motor y las comunicaciones
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          test -s documentacion/CONTACTO_2010_CARATULA_OFICIAL_4K.png
          test -s documentacion/CONTACTO_2010_V1.3_ATLAS_MEMORIA_MANUAL_GRIT_NOVA.pdf
          test -s assets/PILOTO_FIREBIRD_01_RETRATO_RGBA.png
          bash COMPILAR_LINUX.sh
          for t in --self-test --self-test-bso --self-test-aura --self-test-piloto-visor --self-test-final --self-test-estereo-crt --self-test-menu --self-test-fase5; do ./CONTACTO_2010_LINUX "$t"; done
      - name: Verificar PNG original de titulo antes de empaquetar
        run: |
          set -euo pipefail
          echo '4b2094c6e3463b4813273e403ca502ee60d74b0d  assets/CONTACTO_2010_LOGO_JUEGO.png' | git hash-object --stdin >/dev/null
          test "$(git hash-object assets/CONTACTO_2010_LOGO_JUEGO.png)" = '4b2094c6e3463b4813273e403ca502ee60d74b0d'
      - name: Crear AppImage V1.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors -o /tmp/appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool-x86_64.AppImage
          APPIMAGETOOL=/tmp/appimagetool-x86_64.AppImage bash packaging/appimage/CREAR_APPIMAGE.sh
          test -s dist/appimage/Contacto_2010_V1.3-x86_64.AppImage
      - name: Comparar PNG incluido en AppImage con fuente de main
        run: |
          set -euo pipefail
          cmp assets/CONTACTO_2010_LOGO_JUEGO.png dist/appimage/Contacto2010.AppDir/usr/share/contacto2010/assets/CONTACTO_2010_LOGO_JUEGO.png
      - name: Probar AppImage real
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          dist/appimage/Contacto_2010_V1.3-x86_64.AppImage --self-test
          dist/appimage/Contacto_2010_V1.3-x86_64.AppImage --self-test-piloto-visor
          dist/appimage/Contacto_2010_V1.3-x86_64.AppImage --self-test-aura
      - uses: actions/upload-artifact@v4
        with:
          name: CONTACTO_2010_V1.3_LINUX
          path: dist/appimage/Contacto_2010_V1.3-x86_64.AppImage
          compression-level: 0
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-binutils
            zip
      - name: Compilar Windows y generar paquete completo
        run: |
          set -euo pipefail
          bash packaging/windows/COMPILAR_WINDOWS.sh
          bash packaging/windows/EMPAQUETAR_WINDOWS.sh
          cd dist/windows/CONTACTO_2010_V1.3_WINDOWS_x64
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          ./CONTACTO_2010.exe --self-test
          ./CONTACTO_2010.exe --self-test-aura
          ./CONTACTO_2010.exe --self-test-piloto-visor
          ./CONTACTO_2010.exe --self-test-final
          test -s assets/PILOTO_FIREBIRD_01_RETRATO_RGBA.png
          test "$(sha256sum assets/CONTACTO_2010_LOGO_JUEGO.png | awk '{print $1}')" = "$(sha256sum ../../../assets/CONTACTO_2010_LOGO_JUEGO.png | awk '{print $1}')"
      - name: Comprimir Windows x64
        run: |
          set -euo pipefail
          cd dist/windows
          zip -qr CONTACTO_2010_V1.3_WINDOWS_x64.zip CONTACTO_2010_V1.3_WINDOWS_x64
      - uses: actions/upload-artifact@v4
        with:
          name: CONTACTO_2010_V1.3_WINDOWS
          path: dist/windows/CONTACTO_2010_V1.3_WINDOWS_x64.zip
          compression-level: 0
          if-no-files-found: error
  release:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CONTACTO_2010_V1.3_LINUX
          path: /tmp/nuevos
      - uses: actions/download-artifact@v4
        with:
          name: CONTACTO_2010_V1.3_WINDOWS
          path: /tmp/nuevos
      - name: Verificar release y construir SHA256 completo actual
        run: |
          set -euo pipefail
          gh release view v1.3 --json tagName --jq '.tagName' | grep -Fx v1.3
          test -s /tmp/nuevos/Contacto_2010_V1.3-x86_64.AppImage
          test -s /tmp/nuevos/CONTACTO_2010_V1.3_WINDOWS_x64.zip
          mkdir -p /tmp/todos
          gh release download v1.3 --dir /tmp/todos
          # Los ejecutables nuevos sustituyen únicamente a los anteriores.
          cp /tmp/nuevos/Contacto_2010_V1.3-x86_64.AppImage /tmp/todos/
          cp /tmp/nuevos/CONTACTO_2010_V1.3_WINDOWS_x64.zip /tmp/todos/
          cd /tmp/todos
          for f in CONTACTO_2010_CARATULA_OFICIAL_4K.png CONTACTO_2010_V1.3_ATLAS_MEMORIA_MANUAL_GRIT_NOVA.pdf AURA_01_SHEET_RGBA_12F.png CONTACTO_2010_ESCENA_FINAL_OFICIAL_4K.png; do
            test -s "$f"
          done
          find . -maxdepth 1 -type f ! -name 'SHA256_*' -printf '%f\n' | sort | while IFS= read -r file; do sha256sum "$file"; done > /tmp/nuevos/SHA256_CONTACTO_2010_V1.3.txt
          test "$(wc -l </tmp/nuevos/SHA256_CONTACTO_2010_V1.3.txt)" -ge 9
      - name: Refrescar solo binarios y checksum sin tocar portada ni atlas ni tag
        run: |
          set -euo pipefail
          gh release upload v1.3 /tmp/nuevos/Contacto_2010_V1.3-x86_64.AppImage /tmp/nuevos/CONTACTO_2010_V1.3_WINDOWS_x64.zip /tmp/nuevos/SHA256_CONTACTO_2010_V1.3.txt --clobber
          gh release download v1.3 --pattern 'SHA256_CONTACTO_2010_V1.3.txt' --dir /tmp/confirmado
          cmp /tmp/nuevos/SHA256_CONTACTO_2010_V1.3.txt /tmp/confirmado/SHA256_CONTACTO_2010_V1.3.txt
          gh release view v1.3 --json assets --jq '.assets[].name' | grep -Fx 'Contacto_2010_V1.3-x86_64.AppImage'
          gh release view v1.3 --json assets --jq '.assets[].name' | grep -Fx 'CONTACTO_2010_V1.3_WINDOWS_x64.zip'
          echo 'V1.3 ACTUALIZADA: LOGO ORIGINAL EN AMBOS EJECUTABLES.'
