name: CONTACTO 2010 - Actualizacion final de notas oficiales

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirar-releases-antiguas-once.yml'

permissions:
  contents: write

jobs:
  actualizar-notas-oficiales:
    if: github.repository == 'OnRail76/Contacto-2010' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar que solo V1.2.1 sigue publicada y existe el historial
        run: |
          set -euo pipefail
          test -s HISTORIAL_VERSIONES.md
          test "$(gh release list --limit 30 --json tagName --jq '.[].tagName')" = "v1.2.1"
          gh release view v1.2.1 --json assets --jq '.assets[].name' > /tmp/actuales.txt
          for name in             'AURA_01_SHEET_RGBA_12F.png'             'Contacto_2010_V1.2.1-x86_64.AppImage'             'CONTACTO_2010_V1.2.1_WINDOWS_x64.zip'             'CONTACTO_2010_V1.2.1_ATLAS_MEMORIA_MANUAL_GRIT_NOVA.pdf'             'CONTACTO_2010_CARATULA_OFICIAL_4K.png'             'CONTACTO_2010_ESCENA_FINAL_OFICIAL_4K.png'; do
            grep -Fx "$name" /tmp/actuales.txt
          done
      - name: Publicar notas breves y coherentes con la versión única
        run: |
          set -euo pipefail
          cat > /tmp/NOTAS_RELEASE_ACTUAL.md <<'NOTES'
          # CONTACTO 2010 · V1.2.1 — EDICIÓN OFICIAL

          **Tony C. Ware · GRIT NOVA ENGINE · Música original: FutureDark**

          ![Carátula oficial de Firebird-01](https://raw.githubusercontent.com/OnRail76/Contacto-2010/main/documentacion/CONTACTO_2010_CARATULA_OFICIAL.png)

          **Única versión oficial descargable.** Arcade de ciencia ficción con cinco fases y la nave Firebird-01. Incluye **AURA-01**, computadora de a bordo con ojo rojo RGBA animado, conservando las comunicaciones originales.

          ## Novedades vigentes

          - Banda sonora FutureDark en **OGG Vorbis estéreo real** a 44,1 kHz, y efectos con panorámica espacial.
          - Reproductor musical de cassette animado con carretes, contador, barra de progreso y medidores L/R.
          - Scanlines CRT configurables, mandos SDL2 y teclado, y mejoras del motor GRIT NOVA ENGINE.
          - Nueva portada oficial y escena final Firebird-01 integrada en el juego.
          - Atlas y memoria técnica oficial de **44 páginas**, con lámina industrial en la página 2, capturas auténticas, instrucciones Bazzite/Linux y Windows, **sin spoilers**.
          - Código C++17/SDL2 bajo MIT. Arte, marcas y música bajo sus derechos específicos.

          ## Descargas oficiales

          - **Linux x86_64 / Bazzite:** `Contacto_2010_V1.2.1-x86_64.AppImage`.
          - **Windows x64:** `CONTACTO_2010_V1.2.1_WINDOWS_x64.zip`.
          - **Atlas y manual:** `CONTACTO_2010_V1.2.1_ATLAS_MEMORIA_MANUAL_GRIT_NOVA.pdf`.
          - **Arte:** carátula y escena final originales 4K; sheet de AURA-01 con 12 fotogramas RGBA.
          - Ficheros de verificación SHA256 de paquetes y atlas.

          Las versiones sustituidas se documentan en un solo archivo, **[HISTORIAL_VERSIONES.md](https://github.com/OnRail76/Contacto-2010/blob/main/HISTORIAL_VERSIONES.md)**. Los antiguos instaladores no se ofrecen como Releases y se conserva el historial de Git como respaldo técnico.
          NOTES
          gh release edit v1.2.1 --notes-file /tmp/NOTAS_RELEASE_ACTUAL.md
          gh release view v1.2.1 --json body --jq '.body' | grep -F 'HISTORIAL_VERSIONES.md'
