name: Windows EXE x64 V1.1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-binutils
            zip
      - name: Compilar EXE e integrar icono oficial
        run: bash packaging/windows/COMPILAR_WINDOWS.sh
      - name: Recoger DLL nativas y recursos
        run: bash packaging/windows/EMPAQUETAR_WINDOWS.sh
      - name: Probar EXE en el propio Windows
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cd dist/windows/CONTACTO_2010_V1.1_WINDOWS_x64
          ./CONTACTO_2010.exe --self-test
          ./CONTACTO_2010.exe --self-test-fase5
          ./CONTACTO_2010.exe --self-test-controles
          ./CONTACTO_2010.exe --self-test-firebird
          ./CONTACTO_2010.exe --self-test-avisos-escudo
      - name: Crear ZIP nativo de Windows
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/windows/CONTACTO_2010_V1.1_WINDOWS_x64' -DestinationPath 'dist/CONTACTO_2010_V1.1_WINDOWS_x64.zip' -CompressionLevel Optimal
          Get-FileHash 'dist/CONTACTO_2010_V1.1_WINDOWS_x64.zip' -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: CONTACTO_2010_V1.1_WINDOWS_x64
          path: dist/CONTACTO_2010_V1.1_WINDOWS_x64.zip
          compression-level: 0
      - name: Anadir ZIP Windows probado a Release v1.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.1 dist/CONTACTO_2010_V1.1_WINDOWS_x64.zip --clobber
